<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessões - Quadro a Quadro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

    <header>
        <nav>
            <span>📽 Quadro a Quadro</span>
            <ul>
                <li><a th:href="@{/filmes}">Filmes</a></li>
                <li><a th:href="@{/salas}">Salas</a></li>
                <li><a th:href="@{/sessoes}" class="active">Sessões</a></li>
                <li><a th:href="@{/usuarios}">Usuários</a></li>
                <li><a th:href="@{/logout}">→</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Sessões</h1>

        <p th:if="${sucesso}" class="mensagem-sucesso" th:text="${sucesso}"></p>
        <p th:if="${erro}" class="mensagem-erro" th:text="${erro}"></p>

        <section class="barra-acoes">
            <form th:action="@{/sessoes}" method="get">
                <label class="barra-busca">
                    <span><i data-lucide="search"></i></span>
                    <input type="text"
                           name="busca"
                           th:value="${busca}"
                           placeholder="Buscar por sala" />
                </label>
            </form>
            <a th:href="@{/sessoes(hoje=true)}">
                <button type="button" class="btn-hoje"><i data-lucide="sliders-horizontal"></i>Hoje</button>
            </a>
            <button class="btn-primario" onclick="abrirModal('modalNovaSessao')">
                + Nova sessão
            </button>
        </section>

        <section class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Sala</th>
                        <th>Filme</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sessao : ${sessoes}">
                        <td th:text="${sessao.sala.numSala}"></td>
                        <td th:text="${sessao.filme.titulo}"></td>
                        <td th:text="${#temporals.format(sessao.data, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(sessao.horario, 'HH:mm')}"></td>
                        <td>
                            <div class="acoes">
                                <button class="btn-acao"
                                        th:data-id="${sessao.id}"
                                        th:data-filmeid="${sessao.filme.id}"
                                        th:data-salaid="${sessao.sala.id}"
                                        th:data-data="${sessao.data}"
                                        th:data-horario="${sessao.horario}"
                                        onclick="abrirModalEditarSessaoBtn(this)">
                                    <i data-lucide="square-pen"></i>
                                </button>
                                <form th:action="@{/sessoes/excluir/{id}(id=${sessao.id})}"
                                      method="post"
                                      onsubmit="return confirm('Deseja excluir esta sessão?')">
                                    <button type="submit" class="btn-acao excluir"><i data-lucide="trash-2"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sessoes)}">
                        <td colspan="5" class="tabela-vazia">
                            Nenhuma sessão cadastrada.
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="paginacao">
            <label class="paginacao-info">
                Resultados por página
                <select>
                    <option>10</option>
                    <option>20</option>
                    <option>50</option>
                </select>
            </label>
            <nav class="paginacao-botoes" aria-label="Paginação">
                <button>«</button>
                <button>‹</button>
                <span>Página 1 de 1</span>
                <button>›</button>
                <button>»</button>
            </nav>
        </section>
    </main>

    <footer>
        <p>IB Systems &copy; 2026</p>
    </footer>

    <!-- MODAL NOVA SESSÃO -->
    <dialog id="modalNovaSessao">
        <h2>Nova sessão</h2>
        <form th:action="@{/sessoes/nova}" method="post">

            <label>
                Título do filme
                <select name="filme.id" required>
                    <option value="" disabled selected>Selecione um filme</option>
                    <option th:each="filme : ${filmes}"
                            th:value="${filme.id}"
                            th:text="${filme.titulo}">
                    </option>
                </select>
            </label>

            <label>
                Sala
                <select name="sala.id" required>
                    <option value="" disabled selected>Selecione uma sala</option>
                    <option th:each="sala : ${salas}"
                            th:value="${sala.id}"
                            th:text="${sala.numSala}">
                    </option>
                </select>
            </label>

            <div class="modal-linha">
                <label>
                    Data
                    <input type="date" name="data" required />
                </label>
                <label>
                    Horário
                    <input type="time" name="horario" required />
                </label>
            </div>

            <menu>
                <button type="button"
                        class="btn-secundario"
                        onclick="fecharModal('modalNovaSessao')">
                    Cancelar
                </button>
                <button type="submit" class="btn-primario">Salvar</button>
            </menu>
        </form>
    </dialog>

    <!-- MODAL EDITAR SESSÃO -->
    <dialog id="modalEditarSessao">
        <h2>Editar sessão</h2>
        <form id="formEditarSessao" method="post">

            <label>
                Título do filme
                <select id="editarFilmeSessao" name="filme.id" required>
                    <option th:each="filme : ${filmes}"
                            th:value="${filme.id}"
                            th:text="${filme.titulo}">
                    </option>
                </select>
            </label>

            <label>
                Sala
                <select id="editarSalaSessao" name="sala.id" required>
                    <option th:each="sala : ${salas}"
                            th:value="${sala.id}"
                            th:text="${sala.numSala}">
                    </option>
                </select>
            </label>

            <div class="modal-linha">
                <label>
                    Data
                    <input type="date" id="editarDataSessao" name="data" required />
                </label>
                <label>
                    Horário
                    <input type="time" id="editarHorarioSessao" name="horario" required />
                </label>
            </div>

            <menu>
                <button type="button"
                        class="btn-secundario"
                        onclick="fecharModal('modalEditarSessao')">
                    Cancelar
                </button>
                <button type="submit" class="btn-primario">Salvar</button>
            </menu>
        </form>
    </dialog>

    <script th:src="@{/js/modal.js}"></script>
    <script>
        function abrirModalEditarSessaoBtn(btn) {
            const id = btn.getAttribute('data-id');
            const filmeId = btn.getAttribute('data-filmeid');
            const salaId = btn.getAttribute('data-salaid');
            const data = btn.getAttribute('data-data');
            const horario = btn.getAttribute('data-horario');

            document.getElementById('editarFilmeSessao').value = filmeId;
            document.getElementById('editarSalaSessao').value = salaId;
            document.getElementById('editarDataSessao').value = data;
            document.getElementById('editarHorarioSessao').value = horario;
            document.getElementById('formEditarSessao').action = '/sessoes/editar/' + id;
            abrirModal('modalEditarSessao');
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>

</body>
</html>
