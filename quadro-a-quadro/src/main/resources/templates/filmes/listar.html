<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes - Quadro a Quadro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

    <header>
        <nav>
            <span>📽 Quadro a Quadro</span>
            <ul>
                <li><a th:href="@{/filmes}" class="active">Filmes</a></li>
                <li><a th:href="@{/salas}">Salas</a></li>
                <li><a th:href="@{/sessoes}">Sessões</a></li>
                <li><a th:href="@{/usuarios}">Usuários</a></li>
                <li><a th:href="@{/logout}">→</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Filmes</h1>

        <p th:if="${sucesso}" class="mensagem-sucesso" th:text="${sucesso}"></p>
        <p th:if="${erro}" class="mensagem-erro" th:text="${erro}"></p>

        <section class="barra-acoes">
            <form th:action="@{/filmes}" method="get">
                <label class="barra-busca">
                    <span>🔍</span>
                    <input type="text"
                           name="busca"
                           th:value="${busca}"
                           placeholder="Buscar filme" />
                </label>
            </form>
            <a th:href="@{/filmes(ativos=true)}">
                <button type="button" class="btn-hoje">Ativos</button>
            </a>
            <button class="btn-primario" onclick="abrirModal('modalNovoFilme')">
                + Novo Filme
            </button>
        </section>

        <section class="filmes-grid">
            <article class="filme-card" th:each="filme : ${filmes}">

                <img th:if="${filme.capa != null}"
                     th:src="@{'/uploads/capas/' + ${filme.capa}}"
                     th:alt="${filme.titulo}"
                     class="filme-card-capa" />
                <div th:unless="${filme.capa != null}"
                     class="filme-card-capa-placeholder">
                </div>

                <div class="filme-card-info">
                    <p class="filme-card-titulo" th:text="${filme.titulo}"></p>

                    <div>
                        <span class="filme-card-genero"
                              th:each="genero : ${filme.generos}"
                              th:text="${genero}">
                        </span>
                    </div>

                    <p class="filme-card-duracao">⏱ <span th:text="${filme.duracao}"></span> min</p>

                    <div class="filme-card-botoes">
                        <button class="btn-secundario"
                                th:data-id="${filme.id}"
                                onclick="abrirModalEditarFilmeBtn(this)">
                            Editar
                        </button>
                        <form th:action="@{/filmes/excluir/{id}(id=${filme.id})}"
                              method="post"
                              onsubmit="return confirm('Deseja excluir este filme?')">
                            <button type="submit" class="btn-acao excluir">📥</button>
                        </form>
                    </div>
                </div>

            </article>

            <p th:if="${#lists.isEmpty(filmes)}" class="tabela-vazia">
                Nenhum filme cadastrado.
            </p>
        </section>
    </main>

    <footer>
        <p>IB Systems &copy; 2026</p>
    </footer>

    <!-- MODAL NOVO FILME -->
    <dialog id="modalNovoFilme">
        <h2>Novo filme</h2>
        <form th:action="@{/filmes/novo}"
              method="post"
              enctype="multipart/form-data">

            <label>
                Título
                <input type="text"
                       name="titulo"
                       placeholder="Título do filme"
                       required />
            </label>

            <label>
                Duração (minutos)
                <input type="number"
                       name="duracao"
                       placeholder="120"
                       min="30"
                       max="300"
                       required />
            </label>

            <label>
                Classificação
                <select name="classificacao" required>
                    <option value="" disabled selected>Selecione</option>
                    <option th:each="c : ${classificacoes}"
                            th:value="${c}"
                            th:text="${c}">
                    </option>
                </select>
            </label>

            <label>
                Gêneros
                <select name="generos" multiple required>
                    <option th:each="g : ${generos}"
                            th:value="${g}"
                            th:text="${g}">
                    </option>
                </select>
            </label>

            <label>
                Status
                <select name="status" required>
                    <option th:each="s : ${statusList}"
                            th:value="${s}"
                            th:text="${s}">
                    </option>
                </select>
            </label>

            <label>
                Sinopse
                <textarea name="sinopse"
                          placeholder="Sinopse do filme"
                          maxlength="500"
                          rows="3">
                </textarea>
            </label>

            <label>
                Capa do filme
                <input type="file"
                       name="capa"
                       accept=".png,.jpg,.jpeg" />
            </label>

            <menu>
                <button type="button"
                        class="btn-secundario"
                        onclick="fecharModal('modalNovoFilme')">
                    Cancelar
                </button>
                <button type="submit" class="btn-primario">Salvar</button>
            </menu>
        </form>
    </dialog>

    <!-- MODAL EDITAR FILME -->
    <dialog id="modalEditarFilme">
        <h2>Editar filme</h2>
        <form id="formEditarFilme"
              method="post"
              enctype="multipart/form-data">

            <label>
                Título
                <input type="text"
                       id="editarTituloFilme"
                       name="titulo"
                       required />
            </label>

            <label>
                Duração (minutos)
                <input type="number"
                       id="editarDuracaoFilme"
                       name="duracao"
                       min="30"
                       max="300"
                       required />
            </label>

            <label>
                Classificação
                <select id="editarClassificacaoFilme" name="classificacao" required>
                    <option th:each="c : ${classificacoes}"
                            th:value="${c}"
                            th:text="${c}">
                    </option>
                </select>
            </label>

            <label>
                Gêneros
                <select id="editarGenerosFilme" name="generos" multiple required>
                    <option th:each="g : ${generos}"
                            th:value="${g}"
                            th:text="${g}">
                    </option>
                </select>
            </label>

            <label>
                Status
                <select id="editarStatusFilme" name="status" required>
                    <option th:each="s : ${statusList}"
                            th:value="${s}"
                            th:text="${s}">
                    </option>
                </select>
            </label>

            <label>
                Sinopse
                <textarea id="editarSinopseFilme"
                          name="sinopse"
                          maxlength="500"
                          rows="3">
                </textarea>
            </label>

            <label>
                Capa do filme
                <input type="file"
                       name="capa"
                       accept=".png,.jpg,.jpeg" />
            </label>

            <menu>
                <button type="button"
                        class="btn-secundario"
                        onclick="fecharModal('modalEditarFilme')">
                    Cancelar
                </button>
                <button type="submit" class="btn-primario">Salvar</button>
            </menu>
        </form>
    </dialog>

    <script th:src="@{/js/modal.js}"></script>
    <script th:src="@{/js/filmeModal.js}"></script>

</body>
</html>
